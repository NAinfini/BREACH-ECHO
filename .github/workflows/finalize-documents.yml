name: Finalize documentation baseline
on:
  push:
    branches: [docs/finalization-2026-09-05]
    paths: ['tools/migrations/**', 'tools/validate_docs.py', '.github/workflows/finalize-documents.yml']
permissions:
  contents: write
concurrency:
  group: finalize-documentation-baseline
  cancel-in-progress: false
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate validator behavior
        run: python3 tools/validate_docs.py --self-test
      - name: Apply explicit source-preserving migration
        run: python3 tools/migrations/finalize_2026_09_05.py
      - name: Apply reviewed responsibility corrections
        run: python3 tools/migrations/review_2026_09_05.py
      - name: Validate complete documentation
        run: python3 tools/validate_docs.py --reindex
      - name: Commit verified responsibility-document changes
        run: |
          git add docs
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'docs: finalize responsibility rules, decisions, names and complete register'
            git push origin HEAD:docs/finalization-2026-09-05
          fi
      - name: Preserve inventory and diagnostic sources
        if: always()
        run: python3 tools/docs_audit.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documentation-finalization
          path: artifacts/
          retention-days: 7
          if-no-files-found: error
